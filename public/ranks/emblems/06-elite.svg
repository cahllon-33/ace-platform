<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024" role="img" aria-label="A.C.E rank 6 emblem">
<defs>
  <linearGradient id="e6-metal" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0" stop-color="#e6fbff"/><stop offset="0.38" stop-color="#49c6ea"/><stop offset="0.62" stop-color="#0b3a52"/><stop offset="0.82" stop-color="#49c6ea"/><stop offset="1" stop-color="#e6fbff"/>
  </linearGradient>
  <linearGradient id="e6-bevel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e6fbff"/><stop offset="0.5" stop-color="#49c6ea"/><stop offset="1" stop-color="#0b3a52"/>
  </linearGradient>
  <linearGradient id="e6-bevel-dark" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#e6fbff" stop-opacity="0.9"/><stop offset="0.5" stop-color="#0b3a52"/><stop offset="1" stop-color="#000"/>
  </linearGradient>
  <radialGradient id="e6-face" cx="0.5" cy="0.38" r="0.7">
    <stop offset="0" stop-color="#49c6ea" stop-opacity="0.55"/><stop offset="0.45" stop-color="#06141c"/><stop offset="1" stop-color="#000"/>
  </radialGradient>
  <radialGradient id="e6-glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#5fd8ff" stop-opacity="0.45"/><stop offset="1" stop-color="#5fd8ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="e6-sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="e6-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.75"/></filter>
  <clipPath id="e6-clip"><polygon points="256.0,80.0 408.4,168.0 408.4,344.0 256.0,432.0 103.6,344.0 103.6,168.0"/></clipPath>
</defs>
<style>
  .sheen{animation:sheen 6s ease-in-out infinite;transform:translateX(-420px) skewX(-18deg)}
  @keyframes sheen{0%,55%{transform:translateX(-420px) skewX(-18deg)}85%,100%{transform:translateX(520px) skewX(-18deg)}}
  .spark{transform-box:fill-box;transform-origin:center;animation:spark 2.6s ease-in-out infinite;opacity:0}
  @keyframes spark{0%,100%{opacity:0;transform:scale(.3)}45%{opacity:1;transform:scale(1)}}
  @media (prefers-reduced-motion: reduce){.sheen,.spark{animation:none}.sheen{opacity:0}.spark{opacity:.8}}
</style>
<circle cx="256" cy="256" r="250" fill="url(#e6-glow)"/>
<g filter="url(#e6-shadow)">
  <polygon points="80,170 18,132 42,214 70,236" fill="url(#e6-metal)" stroke="#0b3a52" stroke-width="3" stroke-linejoin="round" opacity="1"/><polygon points="432,170 494,132 470,214 442,236" fill="url(#e6-metal)" stroke="#0b3a52" stroke-width="3" stroke-linejoin="round" opacity="1"/>
  
  <polygon points="256.0,44.0 439.6,150.0 439.6,362.0 256.0,468.0 72.4,362.0 72.4,150.0" fill="url(#e6-bevel)" stroke="#0b3a52" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="256.0,60.0 425.7,158.0 425.7,354.0 256.0,452.0 86.3,354.0 86.3,158.0" fill="url(#e6-bevel-dark)"/>
  <polygon points="256.0,76.0 411.9,166.0 411.9,346.0 256.0,436.0 100.1,346.0 100.1,166.0" fill="url(#e6-metal)"/>
  <polygon points="256.0,86.0 403.2,171.0 403.2,341.0 256.0,426.0 108.8,341.0 108.8,171.0" fill="url(#e6-face)" stroke="#0b3a52" stroke-width="3"/>
  <polygon points="256.0,106.0 385.9,181.0 385.9,331.0 256.0,406.0 126.1,331.0 126.1,181.0" fill="none" stroke="#49c6ea" stroke-opacity="0.35" stroke-width="2"/>
  <!-- A mark: outer chevron with bevel faces -->
  <polygon points="256,104 362,368 316,368 256,212 196,368 150,368" fill="url(#e6-metal)" stroke="#0b3a52" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="256,104 256,212 196,368 150,368" fill="#e6fbff" opacity="0.28"/>
  <polygon points="256,104 362,368 316,368 256,212" fill="#000" opacity="0.22"/>
  <polygon points="214,300 298,300 286,330 226,330" fill="url(#e6-bevel)" stroke="#0b3a52" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="256,150 270,186 256,178 242,186" fill="#e6fbff" opacity="0.9"/>
  <rect x="208.5" y="420" width="10" height="10" rx="2" transform="rotate(45 213.5 425)" fill="url(#e6-metal)" stroke="#0b3a52" stroke-width="1.5"/><rect x="225.5" y="420" width="10" height="10" rx="2" transform="rotate(45 230.5 425)" fill="url(#e6-metal)" stroke="#0b3a52" stroke-width="1.5"/><rect x="242.5" y="420" width="10" height="10" rx="2" transform="rotate(45 247.5 425)" fill="url(#e6-metal)" stroke="#0b3a52" stroke-width="1.5"/><rect x="259.5" y="420" width="10" height="10" rx="2" transform="rotate(45 264.5 425)" fill="url(#e6-metal)" stroke="#0b3a52" stroke-width="1.5"/><rect x="276.5" y="420" width="10" height="10" rx="2" transform="rotate(45 281.5 425)" fill="url(#e6-metal)" stroke="#0b3a52" stroke-width="1.5"/><rect x="293.5" y="420" width="10" height="10" rx="2" transform="rotate(45 298.5 425)" fill="url(#e6-metal)" stroke="#0b3a52" stroke-width="1.5"/>
</g>
<g clip-path="url(#e6-clip)"><rect class="sheen" x="0" y="0" width="140" height="512" fill="url(#e6-sheen)"/></g>

</svg>
